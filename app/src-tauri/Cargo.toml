[package]
name = "transcriber"
version = "0.1.0"
description = "Офлайн-транскрибация русской речи в SRT на Whisper"
edition = "2021"

[lib]
name = "transcriber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
