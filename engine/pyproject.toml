[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber-engine"
version = "0.1.0"
description = "Offline Whisper transcription engine (faster-whisper) for the Transcriber desktop app"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2,<2",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
transcriber-engine = "transcriber_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
