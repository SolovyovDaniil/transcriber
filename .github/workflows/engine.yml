name: engine

on:
  push:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install . -r packaging/requirements-build.txt
      - run: pyinstaller packaging/engine.spec --noconfirm
      - name: Check bundled files
        run: |
          $internal = "dist/transcriber-engine/_internal"
          if (-not (Test-Path "$internal/faster_whisper/assets/silero_vad_v6.onnx")) { throw "missing VAD model" }
          if (Test-Path "$internal/cublasLt64_12.dll") { throw "CUDA must not be bundled (NSIS 2 GB limit)" }
          "{0:N0} MB" -f ((Get-ChildItem dist/transcriber-engine -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Smoke test (no GPU on the runner, CPU path)
        run: |
          $exe = "dist/transcriber-engine/transcriber-engine.exe"
          & $exe info
          $out = '{"id":1,"method":"system.info"}', '{"id":2,"method":"shutdown"}' | & $exe
          $out
          if (-not ($out -match '"id": 2, "result": \{"ok": true\}')) { throw "protocol smoke test failed" }
          if (-not ($out -match '"cuda_runtime": "not_needed"')) { throw "runner has no GPU, CUDA status should be not_needed" }
      - uses: actions/upload-artifact@v4
        with:
          name: transcriber-engine-windows
          path: engine/dist/transcriber-engine
          retention-days: 14
