name: app

on:
  push:
    paths: ["app/**", "engine/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "engine/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: cargo test
        working-directory: app/src-tauri

  installer-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build engine
        working-directory: engine
        run: |
          pip install . -r packaging/requirements-build.txt
          pyinstaller packaging/engine.spec --noconfirm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: transcriber-setup-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
